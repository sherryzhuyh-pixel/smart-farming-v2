# AI智慧养殖系统V2.0 - Docker Compose 本地开发环境
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ai_breeding_mysql
    environment:
      MYSQL_ROOT_PASSWORD: breeding_pass
      MYSQL_DATABASE: ai_breeding_v2
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ai_breeding_api
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: breeding_pass
      DB_NAME: ai_breeding_v2
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
