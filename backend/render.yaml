services:
  - type: web
    name: smart-farming-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/smart_farming.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-username.github.io
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEBUG
        value: "false"
    disk:
      name: smart-farming-data
      mountPath: /data
      sizeGB: 1
